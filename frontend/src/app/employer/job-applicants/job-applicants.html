<h2>Applicants</h2>

<div *ngIf="applications.length === 0"
     class="alert alert-info">

  No applicants have applied for this job yet.
</div>

<div
  class="card mb-3"
  *ngFor="let application of applications">

  <div class="card-body">

    <h5>{{ application.name }}</h5>

<p>
  <strong>Email:</strong>
  {{ application.email }}
</p>

  </div>

</div>
