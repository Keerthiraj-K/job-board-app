<div *ngIf="job">

  <div class="card">
    <div class="card-body">

      <h2>{{ job.title }}</h2>

      <p>
        <strong>Company:</strong>
        {{ job.company }}
      </p>

      <p>
        <strong>Location:</strong>
        {{ job.location }}
      </p>

      <p>
        <strong>Skills:</strong>
        {{ job.skills }}
      </p>

      <hr>

      <p>
        {{ job.description }}
      </p>

      <button
  *ngIf="isJobSeeker && !alreadyApplied"
  class="btn btn-primary"
  (click)="applyJob()">

  Apply Now
</button>

<span
  *ngIf="alreadyApplied && isJobSeeker"
  class="badge bg-success ms-2">

  Already Applied
</span>

<button
  *ngIf="canDelete"
  class="btn btn-danger"
  (click)="deleteJob()">

  Delete Job
</button>

<button
  *ngIf="canDelete"
  class="btn btn-info ms-2"
  [routerLink]="['/job-applicants', job.id]">

  View Applicants
</button>

    </div>
  </div>

</div>
