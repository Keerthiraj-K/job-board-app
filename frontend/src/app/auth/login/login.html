<div class="card">
  <div class="card-body">

    <h2>Login</h2>

    <div class="mb-3">
      <input
        class="form-control"
        placeholder="Email"
        [(ngModel)]="credentials.email">
    </div>

    <div class="mb-3">
      <input
        type="password"
        class="form-control"
        placeholder="Password"
        [(ngModel)]="credentials.password">
    </div>

    <button
      class="btn btn-success"
      (click)="login()">

      Login
    </button>

  </div>
</div>
